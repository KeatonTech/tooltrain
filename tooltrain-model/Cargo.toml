[package]
name = "tooltrain-model"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.86"
derive_builder = "0.20.0"
petgraph = { version = "0.6.5", features = ["serde-1", "stable_graph"] }
serde = { version = "1.0.208", features = ["derive"] }
tokio = { version = "1.39.3", features = ["sync"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
type_reg = { version = "0.7.1", features = ["untagged", "debug"] }
